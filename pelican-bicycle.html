<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 - SVG 2D 动画</title>
<style>
  :root {
    --sky: #dff3ff;
    --ground: #d7efc2;
    --road: #5f6670;
    --road-line: #f7e58d;
    --bike: #cf3f3f;
    --dark: #24313a;
    --feather: #f7f4e8;
    --beak: #f5b85b;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background: linear-gradient(#c9ecff 0 70%, #d7efc2 70% 100%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .stage {
    width: min(100vw, 1100px);
    aspect-ratio: 16 / 9;
    position: relative;
    overflow: hidden;
    background: linear-gradient(#dff3ff 0 68%, #d7efc2 68% 100%);
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .cloud {
    animation: cloudMove 18s linear infinite;
  }

  .cloud.slow {
    animation-duration: 26s;
    animation-delay: -8s;
  }

  .scene {
    animation: bob 0.62s ease-in-out infinite alternate;
    transform-box: fill-box;
    transform-origin: center;
  }

  .wheel {
    animation: spin 0.72s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  .pedal {
    animation: spin 0.72s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  .leg-front {
    animation: legFront 0.72s linear infinite;
    transform-box: fill-box;
    transform-origin: 50% 0%;
  }

  .leg-back {
    animation: legBack 0.72s linear infinite;
    transform-box: fill-box;
    transform-origin: 50% 0%;
  }

  .wing {
    animation: wingFlap 1.25s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 18% 28%;
  }

  .head {
    animation: headNod 1.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 40% 85%;
  }

  .eye {
    transform-origin: center;
    transform-box: fill-box;
    animation: blink 4s infinite;
  }

  .road-lines {
    animation: roadMove 1s linear infinite;
  }

  .shadow {
    animation: shadowPulse 0.62s ease-in-out infinite alternate;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes bob {
    from { transform: translateY(0); }
    to { transform: translateY(-6px); }
  }

  @keyframes wingFlap {
    0%, 100% { transform: rotate(4deg); }
    50% { transform: rotate(-13deg); }
  }

  @keyframes headNod {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(2.2deg); }
  }

  @keyframes legFront {
    0%   { transform: rotate(18deg); }
    25%  { transform: rotate(2deg); }
    50%  { transform: rotate(-18deg); }
    75%  { transform: rotate(0deg); }
    100% { transform: rotate(18deg); }
  }

  @keyframes legBack {
    0%   { transform: rotate(-18deg); }
    25%  { transform: rotate(0deg); }
    50%  { transform: rotate(18deg); }
    75%  { transform: rotate(2deg); }
    100% { transform: rotate(-18deg); }
  }

  @keyframes roadMove {
    from { transform: translateX(0); }
    to { transform: translateX(-160px); }
  }

  @keyframes cloudMove {
    from { transform: translateX(0); }
    to { transform: translateX(-1250px); }
  }

  @keyframes shadowPulse {
    from { transform: scaleX(1); opacity: .22; }
    to { transform: scaleX(.92); opacity: .16; }
  }

  @keyframes blink {
    0%, 44%, 48%, 100% { transform: scaleY(1); }
    46% { transform: scaleY(.08); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
<div class="stage" aria-label="一只鹈鹕骑自行车的2D SVG动画">
<svg viewBox="0 0 1100 619" role="img" aria-labelledby="title desc">

  <defs>

  <g class="scene">

        <g stroke="#8f9aa2" stroke-width="2">
          <line x1="-91" y1="0" x2="91" y2="0"/>
          <line x1="0" y1="-91" x2="0" y2="91"/>
          <line x1="-64" y1="-64" x2="64" y2="64"/>

      <g class="wheel" transform="translate(738 494)">

        <g stroke="#8f9aa2" stroke-width="2">
          <line x1="-91" y1="0" x2="91" y2="0"/>

          <circle cx="697" cy="149" r="8" fill="#24313a"/>

        <path d="M718 158 Q797 150 860 171 Q804 186 722 180 Z" fill="#f2b553" stroke="#c98e34" stroke-width="4"/>
        <path d="M720 178 Q790 181 850 173 Q824 229 746 219 Q721 210 720 178 Z" fill="#efbe6b" stroke="#c98e34" stroke-width="4"/>
        <path d="M733 178 Q786 180 830 174" fill="none" stroke="#bd8130" stroke-width="2.8"/>
      </g>

      <path d="M565 284 Q627 300 697 287" fill="none" stroke="#deded6" stroke-width="18" stroke-linecap="round"/>
      <path d="M692 286 Q702 280 713 281" fill="none" stroke="#e3a34c" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <g stroke="#ffffff" opacity=".55" stroke-width="5" stroke-linecap="round">
    <path d="M175 332 H300"/>
    <path d="M210 365 H320"/>
    <path d="M125 397 H270"/>
  </g>
</svg>
</div>
</body>
</html>
